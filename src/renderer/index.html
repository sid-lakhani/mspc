<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSPC — Michael Scott Paper Company</title>
    <meta name="description" content="MSPC — A self-hosted, open-source AI agent workspace. Run a virtual office of autonomous AI coding agents." />
    <!-- Connect to MSPC server API and WebSocket -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 ws://localhost:3000 wss://localhost:3000 https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <!-- Fonts: Press Start 2P (brand), Inter (UI), JetBrains Mono (code) — bundled in src/renderer/src/design/fonts.css -->
    <style>
      #mspc-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #FFF8E7; color: #1A1320;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #mspc-splash .logo {
        display: grid; place-items: center; width: 56px; height: 56px;
        background: #6E1423; color: #F4F1EA; border: 4px solid #4A0D17;
        font-family: "Press Start 2P", monospace; font-size: 11px; letter-spacing: -1px;
        box-shadow: 4px 4px 0 rgba(26,19,32,0.25);
      }
      #mspc-splash .title { font-family: "Press Start 2P", monospace; font-size: 11px; }
      #mspc-splash .hint { font-size: 15px; color: #6B5878; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="mspc-splash">
        <div class="logo">MSPC</div>
        <div class="title">MICHAEL SCOTT PAPER CO.</div>
        <div class="hint">booting the office…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
