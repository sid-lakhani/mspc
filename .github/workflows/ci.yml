name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck server
        run: npm run typecheck:server
      - name: Typecheck client
        run: npm run typecheck:client

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check no old branding leaks
        run: |
          if grep -r "munderdiffl\|Munder Difflin\|munder-difflin\|posthog-node\|electron-updater" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "HISTORY.md"; then
            echo "::error::Old branding or removed dependencies found in source"
            exit 1
          fi
          echo "✓ No old branding found"
